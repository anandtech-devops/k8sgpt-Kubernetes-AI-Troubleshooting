apiVersion: apps/v1
kind: Deployment

metadata:
  name: broken-app
  namespace: k8sgpt-lab
  labels:
    app: broken-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: broken-app

  template:
    metadata:
      labels:
        app: broken-app

    spec:
      containers:
        - name: nginx
          image: nginx:this-image-does-not-exist
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
